name: Registry Drift Check

on:
  push:
    branches: [main]
    paths:
      - 'src/shared/data/**'
      - 'src/engine/**'
      - 'src/bubble/**'
      - 'src/assets/characters/**'
      - 'scripts/check-registry.mjs'
  pull_request:
    paths:
      - 'src/shared/data/**'
      - 'src/engine/**'
      - 'src/bubble/**'
      - 'src/assets/characters/**'
      - 'scripts/check-registry.mjs'
  schedule:
    # Weekly: catch canonical registry changes in vibemon-static
    - cron: '0 1 * * 1'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      # No dependency install: the script only uses node built-ins and fetch.
      - name: Compare bundled fallbacks with vibemon-static canonical
        run: node scripts/check-registry.mjs
